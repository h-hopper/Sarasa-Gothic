name: Build Sarack Code

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "build.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Fetch pinned upstream font inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/downloads .build/sarasa .build/hack .build/out
          curl --fail --location --retry 3 \
            --output .build/downloads/SarasaMonoJ-TTF-Unhinted-1.0.41.7z \
            https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.41/SarasaMonoJ-TTF-Unhinted-1.0.41.7z
          7z x -y \
            .build/downloads/SarasaMonoJ-TTF-Unhinted-1.0.41.7z \
            -o.build/sarasa
          for style in Regular Bold Italic BoldItalic; do
            curl --fail --location --retry 3 \
              --output ".build/hack/Hack-${style}.ttf" \
              "https://raw.githubusercontent.com/source-foundry/Hack/v3.003/build/ttf/Hack-${style}.ttf"
          done

      - name: Locate Sarasa styles
        id: sarasa
        shell: bash
        run: |
          set -euo pipefail
          regular="$(find .build/sarasa -type f -name 'SarasaMonoJ-Regular.ttf' -print -quit)"
          bold="$(find .build/sarasa -type f -name 'SarasaMonoJ-Bold.ttf' -print -quit)"
          italic="$(find .build/sarasa -type f -name 'SarasaMonoJ-Italic.ttf' -print -quit)"
          bolditalic="$(find .build/sarasa -type f -name 'SarasaMonoJ-BoldItalic.ttf' -print -quit)"
          test -n "$regular" && test -n "$bold" && test -n "$italic" && test -n "$bolditalic"
          echo "regular=$regular" >> "$GITHUB_OUTPUT"
          echo "bold=$bold" >> "$GITHUB_OUTPUT"
          echo "italic=$italic" >> "$GITHUB_OUTPUT"
          echo "bolditalic=$bolditalic" >> "$GITHUB_OUTPUT"

      - name: Build Regular
        run: |
          python build.py \
            --sarasa "${{ steps.sarasa.outputs.regular }}" \
            --hack .build/hack/Hack-Regular.ttf \
            --style Regular \
            --family "Sarack Code" \
            --output .build/out/SarackCode-Regular.ttf

      - name: Build Bold
        run: |
          python build.py \
            --sarasa "${{ steps.sarasa.outputs.bold }}" \
            --hack .build/hack/Hack-Bold.ttf \
            --style Bold \
            --family "Sarack Code" \
            --output .build/out/SarackCode-Bold.ttf

      - name: Build Italic
        run: |
          python build.py \
            --sarasa "${{ steps.sarasa.outputs.italic }}" \
            --hack .build/hack/Hack-Italic.ttf \
            --style Italic \
            --family "Sarack Code" \
            --output .build/out/SarackCode-Italic.ttf

      - name: Build Bold Italic
        run: |
          python build.py \
            --sarasa "${{ steps.sarasa.outputs.bolditalic }}" \
            --hack .build/hack/Hack-BoldItalic.ttf \
            --style "Bold Italic" \
            --family "Sarack Code" \
            --output .build/out/SarackCode-BoldItalic.ttf

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sarack-code-four-style-dev
          path: .build/out/
          if-no-files-found: error
          retention-days: 14
